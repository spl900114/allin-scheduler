# Allin-Scheduler 全局配置（通用版）
project:
  root: "."
  name: "my-project"

# 并发限制
max_concurrency: 5

# 超时
stall_timeout_minutes: 10
api_retry_count: 2

# 输出目录（相对运行目录）
output_dir: "output"

# 门禁配置
gates:
  g0: auto
  g1: auto
  g2: auto
  g3: qa-engineer
  g4: devops-engineer

# 角色列表（通用版默认覆盖常见 AI 开发角色，可按项目增删；
# DAG 里用了列表外的角色会报验证警告）
roles:
  - product-manager
  - architect
  - backend-engineer
  - frontend-engineer
  - desktop-engineer
  - ui-ux-designer
  - qa-engineer
  - devops-engineer
  - data-engineer
  - ml-engineer

# 产物校验标准
verification:
  "*-engineer": "代码文件存在且非空"
  qa-engineer: "测试文件存在且非空"
  architect: "契约/文档文件存在"
  default: "对应文档存在"
